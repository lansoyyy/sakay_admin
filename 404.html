<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GoSakay Admin</title>
  <script>
    // GitHub Pages SPA redirect workaround.
    // On refresh, GitHub Pages has no file for /admin/dashboard etc., so we encode
    // the path and send the browser to index.html so Flutter can handle it.
    //
    // Custom domain: site root (0 segments). github.io project site: /sakay_admin (1 segment).
    var l = window.location;
    var segmentsToKeep = 0;
    var pathParts = l.pathname.split('/').filter(function(s) { return s.length > 0; });
    if (l.hostname.endsWith('github.io') && pathParts[0] === 'sakay_admin') {
      segmentsToKeep = 1;
    }
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?p=' +
      l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
